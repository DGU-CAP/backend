spring:
  application:
    name: cap

  jackson:
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:email-smtp.ap-northeast-2.amazonaws.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

prometheus:
  url: ${PROMETHEUS_URL}

loki:
  url: ${LOKI_URL}

ai:
  url: ${AI_URL}

anomaly:
  threshold:
    cpu: ${ANOMALY_THRESHOLD_CPU:90.0}
    memory: ${ANOMALY_THRESHOLD_MEMORY:85.0}
    restart: ${ANOMALY_THRESHOLD_RESTART:3}
    error-rate: ${ANOMALY_THRESHOLD_ERROR_RATE:10.0}

alert:
  email: ${ALERT_EMAIL:admin@example.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
