spring:
  application:
    name: cap

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

prometheus:
  url: ${PROMETHEUS_URL}

loki:
  url: ${LOKI_URL}

ai:
  url: ${AI_URL}

anomaly:
  threshold:
    cpu: ${ANOMALY_THRESHOLD_CPU:90.0}
    memory: ${ANOMALY_THRESHOLD_MEMORY:85.0}
    restart: ${ANOMALY_THRESHOLD_RESTART:3}
    error-rate: ${ANOMALY_THRESHOLD_ERROR_RATE:10.0}

alert:
  email: ${ALERT_EMAIL:admin@example.com}
